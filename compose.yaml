name: japan-earthquake-etl

x-runtime-defaults: &runtime-defaults
  init: true
  restart: unless-stopped
  networks:
    - pipeline

x-resource-baseline: &resource-baseline
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1G
      reservations:
        cpus: "0.25"
        memory: 256M

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-healthy-dependency: &healthy-dependency
  condition: service_healthy
  restart: true
  required: true

x-completed-dependency: &completed-dependency
  condition: service_completed_successfully
  restart: false
  required: true

x-airflow-environment: &airflow-environment
  AIRFLOW_CONFIG: /tmp/airflow.cfg
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
  AIRFLOW__CORE__DEFAULT_TIMEZONE: ${PIPELINE_TIMEZONE:?PIPELINE_TIMEZONE is required}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?AIRFLOW_DB_USER is required}:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@airflow-postgres:5432/${AIRFLOW_DB_NAME:?AIRFLOW_DB_NAME is required}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET:?AIRFLOW_API_JWT_SECRET is required}
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  PIPELINE_TIMEZONE: ${PIPELINE_TIMEZONE:?PIPELINE_TIMEZONE is required}

x-airflow-common: &airflow-common
  <<:
    - *runtime-defaults
    - *resource-baseline
  image: apache/airflow:3.3.2-python3.13
  user: ${AIRFLOW_UID:?AIRFLOW_UID is required}:0
  environment: *airflow-environment
  depends_on:
    airflow-postgres:
      <<: *healthy-dependency
    airflow-init:
      <<: *completed-dependency
  security_opt:
    - no-new-privileges:true
  volumes:
    - type: bind
      source: ./airflow/dags
      target: /opt/airflow/dags
      read_only: true
    - type: volume
      source: airflow_logs
      target: /opt/airflow/logs
    - type: volume
      source: pipeline_staging
      target: /opt/pipeline/staging

x-spark-common: &spark-common
  <<: *runtime-defaults
  image: japan-earthquake-etl/spark:3.5.9-java17
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

services:
  minio:
    <<:
      - *runtime-defaults
      - *resource-baseline
    build:
      context: ./compose/minio
      dockerfile: Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    image: japan-earthquake-etl/minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: build
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    expose:
      - "9000"
    ports:
      - host_ip: 127.0.0.1
        target: 9001
        published: ${MINIO_CONSOLE_HOST_PORT:?MINIO_CONSOLE_HOST_PORT is required}
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:9000/minio/health/live
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - type: volume
        source: minio_data
        target: /data

  minio-init:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint:
      - /bin/sh
      - /opt/minio/init.sh
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      DATA_BUCKET: ${DATA_BUCKET:?DATA_BUCKET is required}
      BRONZE_PREFIX: ${BRONZE_PREFIX:?BRONZE_PREFIX is required}
      SILVER_PREFIX: ${SILVER_PREFIX:?SILVER_PREFIX is required}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
    depends_on:
      minio:
        <<: *healthy-dependency
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./compose/minio/init.sh
        target: /opt/minio/init.sh
        read_only: true

  minio-smoke:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles:
      - smoke
    entrypoint:
      - /bin/sh
      - /opt/minio/smoke.sh
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      DATA_BUCKET: ${DATA_BUCKET:?DATA_BUCKET is required}
      BRONZE_PREFIX: ${BRONZE_PREFIX:?BRONZE_PREFIX is required}
      SILVER_PREFIX: ${SILVER_PREFIX:?SILVER_PREFIX is required}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
    depends_on:
      minio-init:
        <<: *completed-dependency
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./compose/minio/smoke.sh
        target: /opt/minio/smoke.sh
        read_only: true

  airflow-postgres:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: postgres:16.12-bookworm
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?AIRFLOW_DB_USER is required}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?AIRFLOW_DB_NAME is required}
    expose:
      - "5432"
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - type: volume
        source: airflow_db_data
        target: /var/lib/postgresql/data

  airflow-init:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: apache/airflow:3.3.2-python3.13
    user: "0:0"
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/logs /opt/pipeline/staging
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/logs /opt/pipeline/staging
        exec /entrypoint airflow db check
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?AIRFLOW_ADMIN_USERNAME is required}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    depends_on:
      airflow-postgres:
        <<: *healthy-dependency
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./airflow/dags
        target: /opt/airflow/dags
        read_only: true
      - type: volume
        source: airflow_logs
        target: /opt/airflow/logs
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  airflow-api-server:
    <<: *airflow-common
    command:
      - api-server
    ports:
      - host_ip: 127.0.0.1
        target: 8080
        published: ${AIRFLOW_WEB_HOST_PORT:?AIRFLOW_WEB_HOST_PORT is required}
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/api/v2/monitor/health
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command:
      - scheduler
    healthcheck:
      <<: *healthcheck-defaults
      interval: 30s
      timeout: 30s
      retries: 10
      test:
        - CMD-SHELL
        - exec airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      start_period: 60s

  airflow-dag-processor:
    <<: *airflow-common
    command:
      - dag-processor
    healthcheck:
      <<: *healthcheck-defaults
      interval: 30s
      timeout: 30s
      retries: 10
      test:
        - CMD-SHELL
        - exec airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"
      start_period: 60s

  airflow-smoke:
    <<: *airflow-common
    profiles:
      - smoke
    entrypoint:
      - /bin/bash
      - /opt/airflow/smoke/run.sh
    restart: "no"
    depends_on:
      airflow-postgres:
        <<: *healthy-dependency
      airflow-init:
        <<: *completed-dependency
      airflow-api-server:
        <<: *healthy-dependency
      airflow-scheduler:
        <<: *healthy-dependency
      airflow-dag-processor:
        <<: *healthy-dependency
    volumes:
      - type: bind
        source: ./airflow/dags
        target: /opt/airflow/dags
        read_only: true
      - type: bind
        source: ./compose/airflow/smoke.sh
        target: /opt/airflow/smoke/run.sh
        read_only: true
      - type: volume
        source: airflow_logs
        target: /opt/airflow/logs
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  spark-master:
    <<:
      - *spark-common
      - *resource-baseline
    build:
      context: .
      dockerfile: compose/spark/Dockerfile
    pull_policy: build
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    expose:
      - "7077"
    ports:
      - host_ip: 127.0.0.1
        target: 8080
        published: ${SPARK_MASTER_UI_HOST_PORT:?SPARK_MASTER_UI_HOST_PORT is required}
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:8080/
      start_period: 20s

  spark-worker:
    <<: *spark-common
    command:
      - /bin/bash
      - -ec
      - |
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker \
          --host spark-worker \
          --cores "$${SPARK_WORKER_CORES}" \
          --memory "$${SPARK_EXECUTOR_MEMORY}" \
          --webui-port 8081 \
          "$${SPARK_MASTER_URL}"
    environment:
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:?SPARK_EXECUTOR_MEMORY is required}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:?SPARK_MASTER_URL is required}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:?SPARK_WORKER_CORES is required}
    depends_on:
      spark-master:
        <<: *healthy-dependency
    expose:
      - "8081"
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:8081/
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  spark-client:
    <<: *spark-common
    profiles:
      - smoke
    hostname: spark-client
    entrypoint:
      - /bin/bash
      - /opt/spark/smoke/run.sh
    environment:
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:?SPARK_DRIVER_MEMORY is required}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:?SPARK_EXECUTOR_MEMORY is required}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:?SPARK_MASTER_URL is required}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:?SPARK_WORKER_CORES is required}
    restart: "no"
    depends_on:
      spark-master:
        <<: *healthy-dependency
      spark-worker:
        <<: *healthy-dependency
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - type: bind
        source: ./compose/spark/smoke.sh
        target: /opt/spark/smoke/run.sh
        read_only: true
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  iceberg-rest:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: apache/iceberg-rest-fixture:1.10.1@sha256:f7d679d30ac9c640bdeb2c015dff533cd3c8f1c7d491ebcb5d436f9a42db1d6f
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      AWS_REGION: ${S3_REGION:?S3_REGION is required}
      CATALOG_WAREHOUSE: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/home/iceberg/catalog.db
      CATALOG_JDBC_CLIENT_POOL_SIZE: "1"
    depends_on:
      minio-init:
        <<: *completed-dependency
    expose:
      - "8181"
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8181/v1/config
      start_period: 20s
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      # sqlite-jdbc extracts its architecture-specific native library here.
      - /tmp:exec,mode=1777
    volumes:
      - type: volume
        source: iceberg_catalog_data
        target: /home/iceberg

  trino:
    <<: *runtime-defaults
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    environment:
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:?ICEBERG_CATALOG_URI is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
    depends_on:
      minio-init:
        <<: *completed-dependency
      iceberg-rest:
        <<: *healthy-dependency
    ports:
      - host_ip: 127.0.0.1
        target: 8080
        published: ${TRINO_HOST_PORT:?TRINO_HOST_PORT is required}
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - /usr/lib/trino/bin/health-check
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - type: bind
        source: ./trino/catalog
        target: /etc/trino/catalog
        read_only: true

  trino-smoke:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    profiles:
      - smoke
    hostname: trino-smoke
    entrypoint:
      - /bin/bash
      - /opt/trino/smoke/run.sh
    environment:
      HOME: /tmp
      TRINO_CATALOG: ${TRINO_CATALOG:?TRINO_CATALOG is required}
      TRINO_HOST: ${TRINO_HOST:?TRINO_HOST is required}
      TRINO_INTERNAL_PORT: ${TRINO_INTERNAL_PORT:?TRINO_INTERNAL_PORT is required}
      TRINO_SCHEMA: ${TRINO_SCHEMA:?TRINO_SCHEMA is required}
    depends_on:
      trino:
        <<: *healthy-dependency
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Trino CLI/JLine extracts an optional native terminal library here.
      - /tmp:exec,mode=1777
    volumes:
      - type: bind
        source: ./compose/trino/smoke.sh
        target: /opt/trino/smoke/run.sh
        read_only: true

  compose-health-contract:
    <<: *runtime-defaults
    image: busybox:1.36.1
    profiles:
      - validation
    command:
      - tail
      - -f
      - /dev/null
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - "true"
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  compose-contract:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: busybox:1.36.1
    profiles:
      - validation
    command:
      - /bin/true
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      compose-health-contract:
        <<: *healthy-dependency
    volumes:
      - type: volume
        source: pipeline_staging
        target: /mnt/contracts/pipeline-staging
        read_only: true
      - type: volume
        source: airflow_logs
        target: /mnt/contracts/airflow-logs
        read_only: true
      - type: volume
        source: airflow_db_data
        target: /mnt/contracts/airflow-db-data
        read_only: true
      - type: volume
        source: minio_data
        target: /mnt/contracts/minio-data
        read_only: true
      - type: volume
        source: iceberg_catalog_data
        target: /mnt/contracts/iceberg-catalog-data
        read_only: true

networks:
  pipeline:
    driver: bridge
    attachable: false
    labels:
      com.japan-earthquake-etl.scope: pipeline

volumes:
  pipeline_staging:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: transient
      com.japan-earthquake-etl.purpose: staging
  airflow_logs:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: operational
      com.japan-earthquake-etl.purpose: airflow-logs
  airflow_db_data:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: durable
      com.japan-earthquake-etl.purpose: airflow-metadata
  minio_data:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: durable
      com.japan-earthquake-etl.purpose: data-lake
  iceberg_catalog_data:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: durable
      com.japan-earthquake-etl.purpose: catalog-state
