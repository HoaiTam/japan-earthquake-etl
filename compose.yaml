name: japan-earthquake-etl

x-runtime-defaults: &runtime-defaults
  init: true
  restart: unless-stopped
  networks:
    - pipeline

x-resource-baseline: &resource-baseline
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1G
      reservations:
        cpus: "0.25"
        memory: 256M

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-healthy-dependency: &healthy-dependency
  condition: service_healthy
  restart: true
  required: true

x-completed-dependency: &completed-dependency
  condition: service_completed_successfully
  restart: false
  required: true

x-airflow-environment: &airflow-environment
  AIRFLOW_CONFIG: /tmp/airflow.cfg
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "1"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
  AIRFLOW__CORE__DEFAULT_TIMEZONE: ${PIPELINE_TIMEZONE:?PIPELINE_TIMEZONE is required}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?AIRFLOW_DB_USER is required}:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@airflow-postgres:5432/${AIRFLOW_DB_NAME:?AIRFLOW_DB_NAME is required}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET:?AIRFLOW_API_JWT_SECRET is required}
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  PIPELINE_TIMEZONE: ${PIPELINE_TIMEZONE:?PIPELINE_TIMEZONE is required}
  PIPELINE_SCHEDULE_CRON: ${PIPELINE_SCHEDULE_CRON:?PIPELINE_SCHEDULE_CRON is required}
  PIPELINE_OVERLAP_DAYS: ${PIPELINE_OVERLAP_DAYS:?PIPELINE_OVERLAP_DAYS is required}
  SOURCE_SCHEDULE_PROFILE: ${SOURCE_SCHEDULE_PROFILE:-multi-source}
  JMA_READINESS_YEARS: ${JMA_READINESS_YEARS:-[1997,2000,2023]}
  JMA_CHECKSUM_AUDIT_WEEKDAY: ${JMA_CHECKSUM_AUDIT_WEEKDAY:-6}
  SOURCE_GUARD_ROOT: /opt/pipeline/staging/source-guard
  SOURCE_READINESS_ROOT: /opt/pipeline/staging/readiness
  CONFIG_VERSION: ${CONFIG_VERSION:?CONFIG_VERSION is required}
  ETL_PHASE_RUNNER_COMMAND: ${ETL_PHASE_RUNNER_COMMAND:-}
  ETL_PHASE_RUNNER_TIMEOUT_SECONDS: ${ETL_PHASE_RUNNER_TIMEOUT_SECONDS:-3600}
  MLI_IMPORT_REQUEST: ${MLI_IMPORT_REQUEST:-}
  MLI_IMPORT_RUNNER_COMMAND: ${MLI_IMPORT_RUNNER_COMMAND:-/opt/pipeline/bin/mli-import-runner}
  MLI_IMPORT_RUNNER_TIMEOUT_SECONDS: ${MLI_IMPORT_RUNNER_TIMEOUT_SECONDS:-3600}
  MLI_DATASET_REGISTRY_ROOT: ${MLI_DATASET_REGISTRY_ROOT:-/opt/pipeline/staging/ml-artifacts}
  ML_BUILD_MODE: real
  ML_BUILD_NAMESPACE: ${ML_BUILD_NAMESPACE:-iceberg.ml}
  ML_BUILD_RUNNER_SHA256: ${ML_BUILD_RUNNER_SHA256:-}
  ML_BUILD_RUNNER_TIMEOUT_SECONDS: ${ML_BUILD_RUNNER_TIMEOUT_SECONDS:-1800}
  ML_BUILD_STAGING_ROOT: /opt/pipeline/staging/ml-build
  ML_BUILD_EXPORT_ROOT: /opt/pipeline/staging/ml-export
  ETL_STAGING_ROOT: /opt/pipeline/staging/etl
  ORC07_DAILY_MODE: ${ORC07_DAILY_MODE:-disabled}
  ORC07_DAILY_REQUEST_KEY: ${ORC07_DAILY_REQUEST_KEY:-}
  ORC07_DAILY_REQUEST_SHA256: ${ORC07_DAILY_REQUEST_SHA256:-}
  ORC07_STAGING_ROOT: /opt/pipeline/staging/real-etl
  ORC07_PHASE_TIMEOUT_SECONDS: ${ORC07_PHASE_TIMEOUT_SECONDS:-1800}
  CURRENT_MONTH_DAILY_MODE: ${CURRENT_MONTH_DAILY_MODE:-disabled}
  CURRENT_MONTH_CODE_VERSION: ${CURRENT_MONTH_CODE_VERSION:-}
  CURRENT_MONTH_RUNNER_SHA256: ${CURRENT_MONTH_RUNNER_SHA256:-}
  CURRENT_MONTH_DAILY_ROOT: /opt/pipeline/staging/current-month-daily
  CURRENT_MONTH_PHASE_TIMEOUT_SECONDS: ${CURRENT_MONTH_PHASE_TIMEOUT_SECONDS:-1800}
  SILVER_PREFIX: ${SILVER_PREFIX:?SILVER_PREFIX is required}
  ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:?ICEBERG_CATALOG_NAME is required}
  ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:?ICEBERG_CATALOG_URI is required}
  WAREHOUSE_PATH: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}
  TRINO_HOST: ${TRINO_HOST:?TRINO_HOST is required}
  TRINO_INTERNAL_PORT: ${TRINO_INTERNAL_PORT:?TRINO_INTERNAL_PORT is required}
  BACKFILL_STAGING_ROOT: /opt/pipeline/staging/backfill
  BRONZE_REUSE_RUNNER_COMMAND: ${BRONZE_REUSE_RUNNER_COMMAND:-/opt/pipeline/bin/bronze-reuse-verifier}
  BACKFILL_ETL_RUNNER_COMMAND: ${BACKFILL_ETL_RUNNER_COMMAND:-}
  BACKFILL_RUNNER_TIMEOUT_SECONDS: ${BACKFILL_RUNNER_TIMEOUT_SECONDS:-3600}
  RUN_SUMMARY_ROOT: /opt/pipeline/staging/run-summary
  SOURCE_RUNNER_HEAP: ${SOURCE_RUNNER_HEAP:-384m}
  USGS_API_BASE_URL: ${USGS_API_BASE_URL:?USGS_API_BASE_URL is required}
  USGS_MIN_LATITUDE: ${USGS_MIN_LATITUDE:?USGS_MIN_LATITUDE is required}
  USGS_MAX_LATITUDE: ${USGS_MAX_LATITUDE:?USGS_MAX_LATITUDE is required}
  USGS_MIN_LONGITUDE: ${USGS_MIN_LONGITUDE:?USGS_MIN_LONGITUDE is required}
  USGS_MAX_LONGITUDE: ${USGS_MAX_LONGITUDE:?USGS_MAX_LONGITUDE is required}
  USGS_SEED_START_UTC: ${USGS_SEED_START_UTC:?USGS_SEED_START_UTC is required}
  USGS_MAX_WINDOW_DAYS: ${USGS_MAX_WINDOW_DAYS:?USGS_MAX_WINDOW_DAYS is required}
  USGS_REQUEST_LIMIT: ${USGS_REQUEST_LIMIT:?USGS_REQUEST_LIMIT is required}
  USGS_HTTP_TIMEOUT_MS: ${USGS_HTTP_TIMEOUT_MS:?USGS_HTTP_TIMEOUT_MS is required}
  USGS_HTTP_MAX_ATTEMPTS: ${USGS_HTTP_MAX_ATTEMPTS:?USGS_HTTP_MAX_ATTEMPTS is required}
  USGS_HTTP_INITIAL_BACKOFF_MS: ${USGS_HTTP_INITIAL_BACKOFF_MS:?USGS_HTTP_INITIAL_BACKOFF_MS is required}
  USGS_HTTP_MAX_BACKOFF_MS: ${USGS_HTTP_MAX_BACKOFF_MS:?USGS_HTTP_MAX_BACKOFF_MS is required}
  USGS_MAX_RESPONSE_BYTES: ${USGS_MAX_RESPONSE_BYTES:?USGS_MAX_RESPONSE_BYTES is required}
  USGS_EVENT_TYPE: ${USGS_EVENT_TYPE:?USGS_EVENT_TYPE is required}
  USGS_INGEST_RUNNER_COMMAND: ${USGS_INGEST_RUNNER_COMMAND:-/opt/pipeline/bin/usgs-ingest-runner}
  USGS_INGEST_RUNNER_TIMEOUT_SECONDS: ${USGS_INGEST_RUNNER_TIMEOUT_SECONDS:-3600}
  USGS_INGEST_DRY_RUN: ${USGS_INGEST_DRY_RUN:-false}
  JMA_INGEST_RUNNER_COMMAND: ${JMA_INGEST_RUNNER_COMMAND:-/opt/pipeline/bin/jma-ingest-runner}
  JMA_INGEST_RUNNER_TIMEOUT_SECONDS: ${JMA_INGEST_RUNNER_TIMEOUT_SECONDS:-900}
  JMA_INVENTORY_PATH: /opt/pipeline/config/jma/hypocenter_archives_v1.csv
  JMA_STAGING_ROOT: /opt/pipeline/staging/jma
  JMA_BACKFILL_MAX_CONCURRENCY: ${JMA_BACKFILL_MAX_CONCURRENCY:-1}
  JMA_HTTP_TIMEOUT_MS: ${JMA_HTTP_TIMEOUT_MS:-60000}
  JMA_HEAD_MAX_ATTEMPTS: ${JMA_HEAD_MAX_ATTEMPTS:-3}
  JMA_HEAD_INITIAL_BACKOFF_MS: ${JMA_HEAD_INITIAL_BACKOFF_MS:-500}
  JMA_MAX_ARCHIVE_BYTES: ${JMA_MAX_ARCHIVE_BYTES:-134217728}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  DATA_BUCKET: ${DATA_BUCKET:?DATA_BUCKET is required}
  BRONZE_PREFIX: ${BRONZE_PREFIX:?BRONZE_PREFIX is required}

x-airflow-common: &airflow-common
  <<:
    - *runtime-defaults
    - *resource-baseline
  build:
    context: .
    dockerfile: compose/airflow/Dockerfile
  image: japan-earthquake-etl/airflow:3.3.2-python3.13-java17
  pull_policy: build
  user: ${AIRFLOW_UID:?AIRFLOW_UID is required}:0
  environment: *airflow-environment
  depends_on:
    airflow-postgres:
      <<: *healthy-dependency
    airflow-init:
      <<: *completed-dependency
    minio-init:
      <<: *completed-dependency
  security_opt:
    - no-new-privileges:true
  volumes:
    - type: bind
      source: ./airflow/dags
      target: /opt/airflow/dags
      read_only: true
    - type: volume
      source: airflow_logs
      target: /opt/airflow/logs
    - type: volume
      source: pipeline_staging
      target: /opt/pipeline/staging

x-spark-common: &spark-common
  <<: *runtime-defaults
  image: japan-earthquake-etl/spark:3.5.9-java17
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

x-minio-client: &minio-client
  build:
    context: ./compose/minio-client
    dockerfile: Dockerfile
    args:
      MC_VERSION: RELEASE.2025-08-13T08-35-41Z
      MC_COMMIT: 7394ce0dd2a80935aded936b09fa12cbb3cb8096
  image: japan-earthquake-etl/mc:RELEASE.2025-08-13T08-35-41Z
  pull_policy: build

services:
  minio:
    <<:
      - *runtime-defaults
      - *resource-baseline
    build:
      context: ./compose/minio
      dockerfile: Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    image: japan-earthquake-etl/minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: build
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    expose:
      - "9000"
    ports:
      - host_ip: 127.0.0.1
        target: 9001
        published: ${MINIO_CONSOLE_HOST_PORT:?MINIO_CONSOLE_HOST_PORT is required}
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:9000/minio/health/live
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - type: volume
        source: minio_data
        target: /data

  minio-init:
    <<:
      - *runtime-defaults
      - *resource-baseline
      - *minio-client
    entrypoint:
      - /bin/sh
      - /opt/minio/init.sh
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      DATA_BUCKET: ${DATA_BUCKET:?DATA_BUCKET is required}
      BRONZE_PREFIX: ${BRONZE_PREFIX:?BRONZE_PREFIX is required}
      SILVER_PREFIX: ${SILVER_PREFIX:?SILVER_PREFIX is required}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
    depends_on:
      minio:
        <<: *healthy-dependency
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./compose/minio/init.sh
        target: /opt/minio/init.sh
        read_only: true

  minio-smoke:
    <<:
      - *runtime-defaults
      - *resource-baseline
      - *minio-client
    profiles:
      - smoke
    entrypoint:
      - /bin/sh
      - /opt/minio/smoke.sh
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      DATA_BUCKET: ${DATA_BUCKET:?DATA_BUCKET is required}
      BRONZE_PREFIX: ${BRONZE_PREFIX:?BRONZE_PREFIX is required}
      SILVER_PREFIX: ${SILVER_PREFIX:?SILVER_PREFIX is required}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
    depends_on:
      minio-init:
        <<: *completed-dependency
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./compose/minio/smoke.sh
        target: /opt/minio/smoke.sh
        read_only: true

  airflow-postgres:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: postgres:16.12-bookworm
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?AIRFLOW_DB_USER is required}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?AIRFLOW_DB_NAME is required}
    expose:
      - "5432"
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    volumes:
      - type: volume
        source: airflow_db_data
        target: /var/lib/postgresql/data

  airflow-init:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: apache/airflow:3.3.2-python3.13
    user: "0:0"
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/logs /opt/pipeline/staging
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/logs /opt/pipeline/staging
        exec /entrypoint airflow db check
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?AIRFLOW_ADMIN_USERNAME is required}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    depends_on:
      airflow-postgres:
        <<: *healthy-dependency
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ./airflow/dags
        target: /opt/airflow/dags
        read_only: true
      - type: volume
        source: airflow_logs
        target: /opt/airflow/logs
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  airflow-api-server:
    <<: *airflow-common
    command:
      - api-server
    ports:
      - host_ip: 127.0.0.1
        target: 8080
        published: ${AIRFLOW_WEB_HOST_PORT:?AIRFLOW_WEB_HOST_PORT is required}
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/api/v2/monitor/health
      # FND-01 cold acceptance: Python/API startup took 237s under CPU
      # contention; even healthy probes exceeded the inherited 5s timeout.
      # Grace is not a sleep: the first successful probe still marks ready.
      timeout: 15s
      start_period: 240s

  airflow-scheduler:
    <<: *airflow-common
    deploy:
      resources:
        limits:
          cpus: "1.5"
          # Includes LocalExecutor workers + ORC-07 local[1] Spark driver.
          memory: 3G
        reservations:
          cpus: "0.25"
          memory: 256M
    command:
      - scheduler
    healthcheck:
      <<: *healthcheck-defaults
      interval: 30s
      timeout: 30s
      retries: 10
      test:
        - CMD-SHELL
        - exec airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      start_period: 60s

  airflow-dag-processor:
    <<: *airflow-common
    command:
      - dag-processor
    healthcheck:
      <<: *healthcheck-defaults
      interval: 30s
      timeout: 30s
      retries: 10
      test:
        - CMD-SHELL
        - exec airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"
      start_period: 60s

  airflow-smoke:
    <<: *airflow-common
    profiles:
      - smoke
    entrypoint:
      - /bin/bash
      - /opt/airflow/smoke/run.sh
    restart: "no"
    depends_on:
      airflow-postgres:
        <<: *healthy-dependency
      airflow-init:
        <<: *completed-dependency
      airflow-api-server:
        <<: *healthy-dependency
      airflow-scheduler:
        <<: *healthy-dependency
      airflow-dag-processor:
        <<: *healthy-dependency
    volumes:
      - type: bind
        source: ./airflow/dags
        target: /opt/airflow/dags
        read_only: true
      - type: bind
        source: ./compose/airflow/smoke.sh
        target: /opt/airflow/smoke/run.sh
        read_only: true
      - type: volume
        source: airflow_logs
        target: /opt/airflow/logs
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  usgs-live-smoke:
    <<: *airflow-common
    pull_policy: never
    profiles:
      - live
    entrypoint:
      - /bin/bash
      - /opt/airflow/smoke/usgs-live.sh
    restart: "no"
    depends_on:
      airflow-postgres:
        <<: *healthy-dependency
      airflow-init:
        <<: *completed-dependency
      airflow-api-server:
        <<: *healthy-dependency
      airflow-scheduler:
        <<: *healthy-dependency
      airflow-dag-processor:
        <<: *healthy-dependency
      minio-init:
        <<: *completed-dependency
    volumes:
      - type: bind
        source: ./airflow/dags
        target: /opt/airflow/dags
        read_only: true
      - type: bind
        source: ./compose/airflow/usgs-live-smoke.sh
        target: /opt/airflow/smoke/usgs-live.sh
        read_only: true
      - type: volume
        source: airflow_logs
        target: /opt/airflow/logs
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  source-readiness-qa:
    <<: *airflow-common
    pull_policy: never
    profiles: [live]
    entrypoint: [python, /opt/airflow/smoke/source-readiness-qa.py]
    restart: "no"
    volumes:
      - type: bind
        source: ./airflow/dags
        target: /opt/airflow/dags
        read_only: true
      - type: bind
        source: ./compose/airflow/source-readiness-qa.py
        target: /opt/airflow/smoke/source-readiness-qa.py
        read_only: true
      - type: volume
        source: airflow_logs
        target: /opt/airflow/logs
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  jma-live-qa:
    <<: *airflow-common
    pull_policy: never
    profiles:
      - live
    entrypoint:
      - python
      - /opt/airflow/smoke/jma-live-qa.py
    restart: "no"
    volumes:
      - type: bind
        source: ./airflow/dags
        target: /opt/airflow/dags
        read_only: true
      - type: bind
        source: ./compose/airflow/jma-live-qa.py
        target: /opt/airflow/smoke/jma-live-qa.py
        read_only: true
      - type: bind
        source: ./tests/fixtures/real-samples/catalog.json
        target: /opt/airflow/smoke/dat01-catalog.json
        read_only: true
      - type: volume
        source: airflow_logs
        target: /opt/airflow/logs
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  spark-master:
    <<:
      - *spark-common
      - *resource-baseline
    build:
      context: .
      dockerfile: compose/spark/Dockerfile
    pull_policy: build
    environment:
      SPARK_DAEMON_MEMORY: 256m
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    expose:
      - "7077"
    ports:
      - host_ip: 127.0.0.1
        target: 8080
        published: ${SPARK_MASTER_UI_HOST_PORT:?SPARK_MASTER_UI_HOST_PORT is required}
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:8080/
      start_period: 20s

  spark-worker:
    <<: *spark-common
    command:
      - /bin/bash
      - -ec
      - |
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker \
          --host spark-worker \
          --cores "$${SPARK_WORKER_CORES}" \
          --memory "$${SPARK_EXECUTOR_MEMORY}" \
          --webui-port 8081 \
          "$${SPARK_MASTER_URL}"
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:?SPARK_EXECUTOR_MEMORY is required}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:?SPARK_MASTER_URL is required}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:?SPARK_WORKER_CORES is required}
    depends_on:
      spark-master:
        <<: *healthy-dependency
    expose:
      - "8081"
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:8081/
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  spark-client:
    <<: *spark-common
    profiles:
      - smoke
    hostname: spark-client
    entrypoint:
      - /bin/bash
      - /opt/spark/smoke/run.sh
    environment:
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:?SPARK_DRIVER_MEMORY is required}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:?SPARK_EXECUTOR_MEMORY is required}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:?SPARK_MASTER_URL is required}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:?SPARK_WORKER_CORES is required}
    restart: "no"
    depends_on:
      spark-master:
        <<: *healthy-dependency
      spark-worker:
        <<: *healthy-dependency
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - type: bind
        source: ./compose/spark/smoke.sh
        target: /opt/spark/smoke/run.sh
        read_only: true
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  spark-resource-pilot:
    <<: *spark-common
    profiles: [smoke]
    hostname: spark-resource-pilot
    user: ${AIRFLOW_UID:?AIRFLOW_UID is required}:0
    restart: "no"
    entrypoint: [python3, /opt/airflow/dags/resource_pilot.py]
    environment:
      PYTHONPATH: /opt/airflow/dags
      CONFIG_VERSION: ${CONFIG_VERSION:?CONFIG_VERSION is required}
      DATA_BUCKET: ${DATA_BUCKET:?DATA_BUCKET is required}
      BRONZE_PREFIX: ${BRONZE_PREFIX:?BRONZE_PREFIX is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      SOURCE_GUARD_ROOT: /opt/pipeline/staging/source-guard
      BACKFILL_STAGING_ROOT: /opt/pipeline/staging/backfill
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - type: bind
        source: ./airflow/dags
        target: /opt/airflow/dags
        read_only: true
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  spark-silver-integration:
    <<: *spark-common
    profiles: [smoke]
    hostname: spark-silver-integration
    user: ${AIRFLOW_UID:?AIRFLOW_UID is required}:0
    restart: "no"
    entrypoint: [python3, /opt/airflow/dags/silver_integration_qa.py]
    environment:
      PYTHONPATH: /opt/airflow/dags
      CONFIG_VERSION: ${CONFIG_VERSION:?CONFIG_VERSION is required}
      DATA_BUCKET: ${DATA_BUCKET:?DATA_BUCKET is required}
      BRONZE_PREFIX: ${BRONZE_PREFIX:?BRONZE_PREFIX is required}
      SILVER_PREFIX: ${SILVER_PREFIX:-silver}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      SOURCE_GUARD_ROOT: /opt/pipeline/staging/source-guard
      BACKFILL_STAGING_ROOT: /opt/pipeline/staging/backfill
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - type: bind
        source: ./airflow/dags
        target: /opt/airflow/dags
        read_only: true
      - type: volume
        source: pipeline_staging
        target: /opt/pipeline/staging

  iceberg-rest:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: apache/iceberg-rest-fixture:1.10.1@sha256:f7d679d30ac9c640bdeb2c015dff533cd3c8f1c7d491ebcb5d436f9a42db1d6f
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      AWS_REGION: ${S3_REGION:?S3_REGION is required}
      CATALOG_WAREHOUSE: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/home/iceberg/catalog.db
      CATALOG_JDBC_CLIENT_POOL_SIZE: "1"
    depends_on:
      minio-init:
        <<: *completed-dependency
    expose:
      - "8181"
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8181/v1/config
      start_period: 20s
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      # sqlite-jdbc extracts its architecture-specific native library here.
      - /tmp:exec,mode=1777
    volumes:
      - type: volume
        source: iceberg_catalog_data
        target: /home/iceberg

  real-etl-qa:
    <<: *airflow-common
    profiles: [real-etl]
    image: japan-earthquake-etl/real-etl:orc07-java17
    pull_policy: never
    restart: "no"
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 3G}
        reservations: {cpus: "0.25", memory: 256M}
    entrypoint: [/bin/bash, -ec]
    command: ["exec python /opt/airflow/dags/real_etl_acceptance.py"]
    environment:
      <<: *airflow-environment
      PYTHONPATH: /opt/airflow/dags
      ORC07_DAILY_MODE: real
      JMA_READINESS_YEARS: "[2023]"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - pipeline_staging:/opt/pipeline/staging
      - ${ORC07_CAPTURE_ROOT:-./staging/orc06-full-month/captures}:/opt/pipeline/orc07-captures:ro

  spark-gold-qa:
    <<: *runtime-defaults
    profiles: [gold]
    image: japan-earthquake-etl/spark-gold-qa:3.5.9-java17
    build:
      context: .
      dockerfile: compose/spark/Dockerfile.gold-qa
    restart: "no"
    user: ${AIRFLOW_UID:?AIRFLOW_UID is required}:0
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        mkdir -p /opt/pipeline/staging/gold-qa /opt/pipeline/staging/source-guard
        exec python3 /opt/airflow/dags/gold_storage_qa.py
    environment:
      PYTHONPATH: /opt/airflow/dags
      CONFIG_VERSION: ${CONFIG_VERSION:?CONFIG_VERSION is required}
      GOLD_CODE_VERSION: ${GOLD_CODE_VERSION:-local-gld03-v1}
      SOURCE_GUARD_ROOT: /opt/pipeline/staging/source-guard
      DATA_BUCKET: ${DATA_BUCKET:?DATA_BUCKET is required}
      BRONZE_PREFIX: ${BRONZE_PREFIX:?BRONZE_PREFIX is required}
      SILVER_PREFIX: ${SILVER_PREFIX:?SILVER_PREFIX is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:?ICEBERG_CATALOG_NAME is required}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:?ICEBERG_CATALOG_URI is required}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2G}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./spark/target/japan-earthquake-etl-runner.jar:/opt/spark/jobs/japan-earthquake-etl-runner.jar:ro
      - ./spark/target/iceberg:/opt/spark/jobs/iceberg:ro
      - ./spark/src/test/resources/fixtures/real_samples:/opt/pipeline/fixtures:ro
      - pipeline_staging:/opt/pipeline/staging

  gold-verification-qa:
    extends: {service: spark-gold-qa}
    command:
      - |
        mkdir -p /opt/pipeline/staging/gold-publication-qa /opt/pipeline/staging/source-guard
        exec python3 /opt/airflow/dags/gold_publication_qa.py
    environment:
      TRINO_HOST: ${TRINO_HOST:?TRINO_HOST is required}
      TRINO_INTERNAL_PORT: ${TRINO_INTERNAL_PORT:?TRINO_INTERNAL_PORT is required}
    volumes:
      - ${GOLD_COMMIT_REFERENCE:-./docs/evidence/GLD-03-runtime.json}:/opt/pipeline/gold-commit-reference.json:ro

  dataset-manifest-qa:
    extends: {service: gold-verification-qa}
    command:
      - |
        mkdir -p /opt/pipeline/staging/dataset-manifest-qa /opt/pipeline/staging/source-guard
        exec python3 /opt/airflow/dags/dataset_manifest_qa.py
    volumes:
      - ${GOLD_PUBLICATION_REFERENCE:-./docs/evidence/GLD-04-runtime.json}:/opt/pipeline/gold-publication-reference.json:ro
      - ${DATASET_IDENTITY_CONFIG:-./config/ml/dataset_identity_v1.json}:/opt/pipeline/dataset-config.json:ro

  gold-input-audit-qa:
    extends: {service: gold-verification-qa}
    image: japan-earthquake-etl/spark:3.5.9-java17
    build:
      context: .
      dockerfile: compose/spark/Dockerfile
    command:
      - |
        mkdir -p /opt/pipeline/staging/gold-input-audit-qa /opt/pipeline/staging/source-guard
        exec python3 /opt/airflow/dags/gold_input_audit_qa.py
    volumes:
      - ${SILVER_AUDIT_REFERENCE:-./docs/evidence/SLV-09-live-readback.json}:/opt/pipeline/silver-reference.json:ro

  mainshock-window-qa:
    extends: {service: gold-input-audit-qa}
    command:
      - |
        mkdir -p /opt/pipeline/staging/mainshock-window-qa /opt/pipeline/staging/source-guard
        exec python3 /opt/airflow/dags/mainshock_window_qa.py
    volumes:
      - ${MAINSHOCK_BRONZE_PINS:-./airflow/dags/fixtures/slv_09_bronze_inputs.json}:/opt/pipeline/window-bronze-pins.json:ro

  mli-03-import-results:
    extends: {service: spark-gold-qa}
    profiles: [ml]
    command:
      - |
        exec python3 /opt/airflow/dags/mli_03_import_results.py "$${MLI_IMPORT_REQUEST}"
    environment:
      TRINO_HOST: ${TRINO_HOST:?TRINO_HOST is required}
      TRINO_INTERNAL_PORT: ${TRINO_INTERNAL_PORT:?TRINO_INTERNAL_PORT is required}
      MLI_DATASET_REGISTRY_ROOT: ${MLI_DATASET_REGISTRY_ROOT:-/opt/pipeline/staging/ml-artifacts}
      MLI_IMPORT_REQUEST: ${MLI_IMPORT_REQUEST:-}
      MLI_IMPORT_RUNNER_COMMAND: ${MLI_IMPORT_RUNNER_COMMAND:-/opt/pipeline/bin/mli-import-runner}
      MLI_IMPORT_RUNNER_TIMEOUT_SECONDS: ${MLI_IMPORT_RUNNER_TIMEOUT_SECONDS:-3600}
    volumes:
      - ./compose/airflow/mli-import-runner.sh:/opt/pipeline/bin/mli-import-runner:ro
      - ./spark/src/test/resources/ml/results:/opt/pipeline/ml-result-fixtures:ro

  pipeline-qa-acceptance:
    extends: {service: gold-verification-qa}
    profiles: [ml]
    command:
      - |
        exec python3 /opt/airflow/dags/pipeline_qa_acceptance.py --task "$${PIPELINE_QA_TASK}"
    environment:
      PIPELINE_QA_TASK: ${PIPELINE_QA_TASK:-QA-02}
    volumes:
      - ./tests/fixtures:/opt/pipeline/qa-fixtures:ro
      - ./config/jma/hypocenter_archives_v1.csv:/opt/pipeline/config/jma/hypocenter_archives_v1.csv:ro
      - ./staging/qa-history-captures:/opt/pipeline/qa-history-captures:ro
      - ./spark/src/test/resources/ml/results:/opt/pipeline/ml-result-fixtures:ro

  mld05-feature-export:
    extends: {service: pipeline-qa-acceptance}
    profiles: [ml]
    command:
      - |
        exec python3 /opt/airflow/dags/feature_export_runtime.py --dataset-id "$${MLD05_DATASET_ID}" --namespace "$${MLD05_NAMESPACE}"
    environment:
      MLD05_DATASET_ID: ${MLD05_DATASET_ID:-}
      MLD05_NAMESPACE: ${MLD05_NAMESPACE:-}

  qa-02-rerun-revision:
    extends: {service: spark-gold-qa}
    profiles: [ml]
    command:
      - |
        mkdir -p /opt/pipeline/staging/qa-02 /opt/pipeline/staging/source-guard
        exec python3 /opt/airflow/dags/qa_02_rerun_revision.py --live "$${QA_02_RUNTIME_REQUEST}"
    environment:
      QA_02_RUNTIME_REQUEST: ${QA_02_RUNTIME_REQUEST:-}
      QA_02_RUNTIME_COMMAND: ${QA_02_RUNTIME_COMMAND:-}

  qa-03-jma-historical-backfill:
    extends: {service: spark-gold-qa}
    profiles: [gold]
    command:
      - |
        mkdir -p /opt/pipeline/staging/qa-03 /opt/pipeline/staging/source-guard
        exec python3 /opt/airflow/dags/qa_03_jma_historical_backfill.py --live "$${QA_03_RUNTIME_REQUEST}"
    environment:
      TRINO_HOST: ${TRINO_HOST:?TRINO_HOST is required}
      TRINO_INTERNAL_PORT: ${TRINO_INTERNAL_PORT:?TRINO_INTERNAL_PORT is required}
      QA_03_RUNTIME_REQUEST: ${QA_03_RUNTIME_REQUEST:-}
      QA_03_RUNTIME_COMMAND: ${QA_03_RUNTIME_COMMAND:-}
    volumes:
      - ./config/jma/hypocenter_archives_v1.csv:/opt/pipeline/config/jma/hypocenter_archives_v1.csv:ro

  qa-04-failure-recovery:
    extends: {service: spark-gold-qa}
    profiles: [ml]
    command:
      - |
        mkdir -p /opt/pipeline/staging/qa-04 /opt/pipeline/staging/source-guard
        exec python3 /opt/airflow/dags/qa_04_failure_recovery.py runtime --request "$${QA_04_REQUEST}"
    environment:
      TRINO_HOST: ${TRINO_HOST:?TRINO_HOST is required}
      TRINO_INTERNAL_PORT: ${TRINO_INTERNAL_PORT:?TRINO_INTERNAL_PORT is required}
      QA_04_REQUEST: ${QA_04_REQUEST:-}
      QA_04_RUNTIME_COMMAND: ${QA_04_RUNTIME_COMMAND:-}
      QA_04_STAGING_ROOT: /opt/pipeline/staging/qa-04
      ORC_07_STATUS: ${ORC_07_STATUS:-Ready}
      MLI_03_STATUS: ${MLI_03_STATUS:-In Progress}

  trino:
    <<: *runtime-defaults
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    environment:
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:?ICEBERG_CATALOG_URI is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:?WAREHOUSE_PATH is required}
    depends_on:
      minio-init:
        <<: *completed-dependency
      iceberg-rest:
        <<: *healthy-dependency
    ports:
      - host_ip: 127.0.0.1
        target: 8080
        published: ${TRINO_HOST_PORT:?TRINO_HOST_PORT is required}
        protocol: tcp
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - /usr/lib/trino/bin/health-check
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - type: bind
        source: ./trino/catalog
        target: /etc/trino/catalog
        read_only: true
      - type: bind
        source: ./trino/log.properties
        target: /etc/trino/log.properties
        read_only: true

  trino-smoke:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    profiles:
      - smoke
    hostname: trino-smoke
    entrypoint:
      - /bin/bash
      - /opt/trino/smoke/run.sh
    environment:
      HOME: /tmp
      TRINO_CATALOG: ${TRINO_CATALOG:?TRINO_CATALOG is required}
      TRINO_HOST: ${TRINO_HOST:?TRINO_HOST is required}
      TRINO_INTERNAL_PORT: ${TRINO_INTERNAL_PORT:?TRINO_INTERNAL_PORT is required}
      TRINO_SCHEMA: ${TRINO_SCHEMA:?TRINO_SCHEMA is required}
    depends_on:
      trino:
        <<: *healthy-dependency
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Trino CLI/JLine extracts an optional native terminal library here.
      - /tmp:exec,mode=1777
    volumes:
      - type: bind
        source: ./compose/trino/smoke.sh
        target: /opt/trino/smoke/run.sh
        read_only: true

  compose-health-contract:
    <<: *runtime-defaults
    image: busybox:1.36.1
    profiles:
      - validation
    command:
      - tail
      - -f
      - /dev/null
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - "true"
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  compose-contract:
    <<:
      - *runtime-defaults
      - *resource-baseline
    image: busybox:1.36.1
    profiles:
      - validation
    command:
      - /bin/true
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      compose-health-contract:
        <<: *healthy-dependency
    volumes:
      - type: volume
        source: pipeline_staging
        target: /mnt/contracts/pipeline-staging
        read_only: true
      - type: volume
        source: airflow_logs
        target: /mnt/contracts/airflow-logs
        read_only: true
      - type: volume
        source: airflow_db_data
        target: /mnt/contracts/airflow-db-data
        read_only: true
      - type: volume
        source: minio_data
        target: /mnt/contracts/minio-data
        read_only: true
      - type: volume
        source: iceberg_catalog_data
        target: /mnt/contracts/iceberg-catalog-data
        read_only: true

networks:
  pipeline:
    driver: bridge
    attachable: false
    labels:
      com.japan-earthquake-etl.scope: pipeline

volumes:
  pipeline_staging:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: transient
      com.japan-earthquake-etl.purpose: staging
  airflow_logs:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: operational
      com.japan-earthquake-etl.purpose: airflow-logs
  airflow_db_data:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: durable
      com.japan-earthquake-etl.purpose: airflow-metadata
  minio_data:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: durable
      com.japan-earthquake-etl.purpose: data-lake
  iceberg_catalog_data:
    driver: local
    labels:
      com.japan-earthquake-etl.lifecycle: durable
      com.japan-earthquake-etl.purpose: catalog-state
